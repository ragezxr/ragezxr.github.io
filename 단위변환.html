<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단위변환</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#ff6b00',
                            orangeHover: '#e05e00',
                            darkBg: '#121214',
                            cardBg: '#1e1e24',
                            innerBg: '#2a2a32',
                            border: '#3a3a45',
                            textMuted: '#9ea0a5'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar styling for dark theme */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e24;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3a45;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a58;
        }
    </style>
</head>
<body class="bg-brand-darkBg text-gray-100 min-h-screen flex items-center justify-center p-3 sm:p-6 font-sans">

    <div class="w-full max-w-4xl bg-brand-cardBg border border-brand-border rounded-xl shadow-2xl p-4 sm:p-7 space-y-6">
        
        <!-- Header -->
        <div class="border-b border-brand-border pb-4">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white flex items-center gap-3">
                <i class="fa-solid font-black text-brand-orange fa-calculator"></i>
                단위변환
            </h1>
        </div>

        <!-- Category Navigation Tabs -->
        <div class="overflow-x-auto pb-1">
            <nav id="category-tabs" class="flex whitespace-nowrap gap-1 border-b border-brand-border pb-2 text-sm sm:text-base">
                <!-- Dynamic tabs injected by JS -->
            </nav>
        </div>

        <!-- Converter Box -->
        <div class="bg-brand-innerBg rounded-lg p-4 sm:p-5 border border-brand-border space-y-4">
            
            <!-- Source & Target Unit Selection Header -->
            <div class="flex items-center justify-between gap-2 flex-wrap sm:flex-nowrap">
                <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-3 items-center w-full">
                    <!-- Source Unit Select -->
                    <div class="relative">
                        <label class="block text-xs text-brand-textMuted mb-1">변환할 단위 (FROM)</label>
                        <select id="source-unit-select" class="w-full bg-brand-cardBg border border-brand-border text-white text-sm sm:text-base rounded-md p-2.5 focus:ring-2 focus:ring-brand-orange focus:outline-none appearance-none cursor-pointer pr-8">
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3 bottom-3 text-brand-textMuted pointer-events-none text-xs"></i>
                    </div>

                    <!-- Target Unit Select -->
                    <div class="relative">
                        <label class="block text-xs text-brand-textMuted mb-1">결과 단위 (TO)</label>
                        <select id="target-unit-select" class="w-full bg-brand-cardBg border border-brand-border text-white text-sm sm:text-base rounded-md p-2.5 focus:ring-2 focus:ring-brand-orange focus:outline-none appearance-none cursor-pointer pr-8">
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3 bottom-3 text-brand-textMuted pointer-events-none text-xs"></i>
                    </div>
                </div>

                <!-- Swap Button -->
                <div class="flex items-end self-end sm:self-auto pt-2 sm:pt-4">
                    <button id="swap-btn" title="단위 맞바꾸기" class="bg-brand-cardBg hover:bg-brand-border text-gray-200 border border-brand-border rounded-md p-2.5 px-3.5 transition-colors duration-150 flex items-center justify-center text-lg active:scale-95">
                        <i class="fa-solid fa-right-left"></i>
                    </button>
                </div>
            </div>

            <!-- Input & Single Result Row -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                <!-- Value Input -->
                <div class="flex items-center bg-brand-cardBg border border-brand-border rounded-md px-3 py-2 focus-within:ring-2 focus-within:ring-brand-orange">
                    <input type="number" id="input-value" value="1" step="any" class="w-full bg-transparent text-right text-lg sm:text-xl font-bold text-white focus:outline-none pr-2">
                    <span id="source-unit-symbol" class="text-sm font-semibold text-gray-300 min-w-fit">cm</span>
                </div>

                <!-- Equals Icon & Main Result Display -->
                <div class="flex items-center bg-brand-cardBg border border-brand-border rounded-md px-3 py-2 min-h-[50px] justify-between">
                    <span class="text-brand-textMuted font-medium pr-2 text-lg">=</span>
                    <div class="text-right truncate">
                        <span id="main-result-value" class="text-xl sm:text-2xl font-extrabold text-brand-orange tracking-wide">0.393701</span>
                        <span id="target-unit-symbol" class="text-sm font-semibold text-gray-300 ml-1">in</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- All-Units Comparison Grid -->
        <div id="all-units-section" class="bg-brand-innerBg/50 border border-brand-border/60 rounded-lg p-4">
            <h3 class="text-xs font-semibold text-brand-textMuted uppercase tracking-wider mb-3">전체 단위 비교 결과</h3>
            <div id="units-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-2.5 text-sm">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- Helper Footer -->
        <div class="border-t border-brand-border pt-3">
            <p class="text-xs text-brand-textMuted text-center leading-relaxed">
                <i class="fa-solid fa-circle-info mr-1 text-brand-orange/80"></i>
                변환할 숫자를 입력하거나, 현재 단위 및 변환할 단위를 선택하면 자동으로 결과 값이 변경됩니다.
            </p>
        </div>

    </div>

    <script>
        // Data Definitions for Units
        const unitData = {
            length: {
                name: '길이',
                icon: 'fa-ruler',
                base: 'm',
                units: [
                    { id: 'mm', name: '밀리미터', symbol: 'mm', ratio: 0.001 },
                    { id: 'cm', name: '센티미터', symbol: 'cm', ratio: 0.01 },
                    { id: 'm', name: '미터', symbol: 'm', ratio: 1 },
                    { id: 'km', name: '킬로미터', symbol: 'km', ratio: 1000 },
                    { id: 'in', name: '인치', symbol: 'in', ratio: 0.0254 },
                    { id: 'ft', name: '피트', symbol: 'ft', ratio: 0.3048 },
                    { id: 'yd', name: '야드', symbol: 'yd', ratio: 0.9144 },
                    { id: 'mile', name: '마일', symbol: 'mile', ratio: 1609.344 },
                    { id: 'ja', name: '자', symbol: '尺', ratio: 10 / 33 }, // ~0.303m
                    { id: 'gan', name: '간', symbol: '間', ratio: 60 / 33 }, // ~1.818m
                    { id: 'jeong', name: '정', symbol: '町', ratio: 3600 / 33 }, // ~109.09m
                    { id: 'ri', name: '리', symbol: '里', ratio: 14400 / 33 }, // ~392.72m
                    { id: 'nmi', name: '해리', symbol: '海里', ratio: 1852 }
                ]
            },
            area: {
                name: '넓이',
                icon: 'fa-vector-square',
                base: 'm2',
                units: [
                    { id: 'm2', name: '제곱미터', symbol: 'm²', ratio: 1 },
                    { id: 'a', name: '아르', symbol: 'a', ratio: 100 },
                    { id: 'ha', name: '헥타르', symbol: 'ha', ratio: 10000 },
                    { id: 'km2', name: '제곱킬로미터', symbol: 'km²', ratio: 1000000 },
                    { id: 'ft2', name: '제곱피트', symbol: 'ft²', ratio: 0.092903 },
                    { id: 'yd2', name: '제곱야드', symbol: 'yd²', ratio: 0.836127 },
                    { id: 'acre', name: '에이커', symbol: 'ac', ratio: 4046.856422 },
                    { id: 'pyeong', name: '평', symbol: '평', ratio: 400 / 121 }, // ~3.305785m²
                    { id: 'danbo', name: '단보', symbol: '段步', ratio: 991.7355 },
                    { id: 'jeongbo', name: '정보', symbol: '町步', ratio: 9917.355 }
                ]
            },
            weight: {
                name: '무게',
                icon: 'fa-weight-hanging',
                base: 'g',
                units: [
                    { id: 'mg', name: '밀리그램', symbol: 'mg', ratio: 0.001 },
                    { id: 'g', name: '그램', symbol: 'g', ratio: 1 },
                    { id: 'kg', name: '킬로그램', symbol: 'kg', ratio: 1000 },
                    { id: 'ton', name: '톤', symbol: 't', ratio: 1000000 },
                    { id: 'grain', name: '그레인', symbol: 'gr', ratio: 0.0647989 },
                    { id: 'oz', name: '온스', symbol: 'oz', ratio: 28.349523 },
                    { id: 'lb', name: '파운드', symbol: 'lb', ratio: 453.59237 },
                    { id: 'don', name: '돈', symbol: '돈', ratio: 3.75 },
                    { id: 'nyang', name: '냥', symbol: '냥', ratio: 37.5 },
                    { id: 'geun', name: '근(고기)', symbol: '근', ratio: 600 },
                    { id: 'gwan', name: '관', symbol: '貫', ratio: 3750 }
                ]
            },
            volume: {
                name: '부피',
                icon: 'fa-cube',
                base: 'L',
                units: [
                    { id: 'cc', name: '시시', symbol: 'cc', ratio: 0.001 },
                    { id: 'ml', name: '밀리리터', symbol: 'mL', ratio: 0.001 },
                    { id: 'dl', name: '데시리터', symbol: 'dL', ratio: 0.1 },
                    { id: 'l', name: '리터', symbol: 'L', ratio: 1 },
                    { id: 'cm3', name: '세제곱센티미터', symbol: 'cm³', ratio: 0.001 },
                    { id: 'm3', name: '세제곱미터', symbol: 'm³', ratio: 1000 },
                    { id: 'in3', name: '세제곱인치', symbol: 'in³', ratio: 0.016387 },
                    { id: 'ft3', name: '세제곱피트', symbol: 'ft³', ratio: 28.316847 },
                    { id: 'gal', name: '갤런(US)', symbol: 'gal', ratio: 3.785412 },
                    { id: 'bbl', name: '배럴(석유)', symbol: 'bbl', ratio: 158.987295 },
                    { id: 'hop', name: '홉', symbol: '合', ratio: 0.18039 },
                    { id: 'doe', name: '되', symbol: '升', ratio: 1.8039 },
                    { id: 'mal', name: '말', symbol: '斗', ratio: 18.039 }
                ]
            },
            temperature: {
                name: '온도',
                icon: 'fa-temperature-half',
                custom: true, // Special handling for non-linear scale
                units: [
                    { id: 'C', name: '섭씨온도', symbol: '℃' },
                    { id: 'F', name: '화씨온도', symbol: '℉' },
                    { id: 'K', name: '절대온도', symbol: 'K' },
                    { id: 'R', name: '란씨온도', symbol: '°R' }
                ]
            },
            pressure: {
                name: '압력',
                icon: 'fa-gauge-high',
                base: 'pa',
                units: [
                    { id: 'pa', name: '파스칼', symbol: 'Pa', ratio: 1 },
                    { id: 'hpa', name: '헥토파스칼', symbol: 'hPa', ratio: 100 },
                    { id: 'kpa', name: '킬로파스칼', symbol: 'kPa', ratio: 1000 },
                    { id: 'mpa', name: '메가파스칼', symbol: 'MPa', ratio: 1000000 },
                    { id: 'bar', name: '바', symbol: 'bar', ratio: 100000 },
                    { id: 'atm', name: '표준기압', symbol: 'atm', ratio: 101325 },
                    { id: 'mmHg', name: '수은주밀리미터', symbol: 'mmHg', ratio: 133.322 },
                    { id: 'psi', name: '파운드제곱인치', symbol: 'psi', ratio: 6894.757 }
                ]
            },
            speed: {
                name: '속도',
                icon: 'fa-gauge-simple-high',
                base: 'm_s',
                units: [
                    { id: 'm_s', name: '미터/초', symbol: 'm/s', ratio: 1 },
                    { id: 'm_h', name: '미터/시', symbol: 'm/h', ratio: 1 / 3600 },
                    { id: 'km_s', name: '킬로미터/초', symbol: 'km/s', ratio: 1000 },
                    { id: 'km_h', name: '킬로미터/시', symbol: 'km/h', ratio: 1000 / 3600 },
                    { id: 'in_s', name: '인치/초', symbol: 'in/s', ratio: 0.0254 },
                    { id: 'ft_s', name: '피트/초', symbol: 'ft/s', ratio: 0.3048 },
                    { id: 'mile_h', name: '마일/시', symbol: 'mile/h', ratio: 0.44704 },
                    { id: 'knot', name: '매듭(노트)', symbol: 'kt', ratio: 0.514444 },
                    { id: 'mach', name: '마하', symbol: 'mach', ratio: 340 }
                ]
            },
            fuel: {
                name: '연비',
                icon: 'fa-gas-pump',
                custom: true,
                units: [
                    { id: 'km_l', name: '킬로미터/리터', symbol: 'km/L' },
                    { id: 'l_100km', name: '리터/100킬로미터', symbol: 'L/100km' },
                    { id: 'mpg_us', name: '마일/갤런(US)', symbol: 'mpg' },
                    { id: 'mpg_uk', name: '마일/갤런(UK)', symbol: 'mpg(Imperial)' }
                ]
            },
            data: {
                name: '데이터양',
                icon: 'fa-database',
                base: 'b',
                units: [
                    { id: 'bit', name: '비트', symbol: 'bit', ratio: 1 },
                    { id: 'B', name: '바이트', symbol: 'B', ratio: 8 },
                    { id: 'KB', name: '킬로바이트', symbol: 'KB', ratio: 8 * 1024 },
                    { id: 'MB', name: '메가바이트', symbol: 'MB', ratio: 8 * Math.pow(1024, 2) },
                    { id: 'GB', name: '기가바이트', symbol: 'GB', ratio: 8 * Math.pow(1024, 3) },
                    { id: 'TB', name: '테라바이트', symbol: 'TB', ratio: 8 * Math.pow(1024, 4) },
                    { id: 'PB', name: '페타바이트', symbol: 'PB', ratio: 8 * Math.pow(1024, 5) },
                    { id: 'EB', name: '엑사바이트', symbol: 'EB', ratio: 8 * Math.pow(1024, 6) }
                ]
            },
            time: {
                name: '시간',
                icon: 'fa-clock',
                base: 'sec',
                units: [
                    { id: 'ms', name: '밀리초', symbol: 'ms', ratio: 0.001 },
                    { id: 'sec', name: '초', symbol: 's', ratio: 1 },
                    { id: 'min', name: '분', symbol: 'm', ratio: 60 },
                    { id: 'hr', name: '시', symbol: 'h', ratio: 3600 },
                    { id: 'day', name: '일', symbol: 'd', ratio: 86400 },
                    { id: 'week', name: '주', symbol: 'wk', ratio: 604800 },
                    { id: 'month', name: '월(30일)', symbol: 'mo', ratio: 2592000 },
                    { id: 'year', name: '년(365일)', symbol: 'yr', ratio: 31536000 }
                ]
            }
        };

        let currentCategoryKey = 'length';
        let sourceUnitId = 'cm';
        let targetUnitId = 'in';

        // DOM elements
        const tabsContainer = document.getElementById('category-tabs');
        const sourceSelect = document.getElementById('source-unit-select');
        const targetSelect = document.getElementById('target-unit-select');
        const inputValueEl = document.getElementById('input-value');
        const mainResultValueEl = document.getElementById('main-result-value');
        const sourceSymbolEl = document.getElementById('source-unit-symbol');
        const targetSymbolEl = document.getElementById('target-unit-symbol');
        const unitsGrid = document.getElementById('units-grid');
        const swapBtn = document.getElementById('swap-btn');

        function initApp() {
            renderTabs();
            switchCategory(currentCategoryKey);

            // Event Listeners
            inputValueEl.addEventListener('input', calculateAll);
            sourceSelect.addEventListener('change', (e) => {
                sourceUnitId = e.target.value;
                updateSymbols();
                calculateAll();
            });
            targetSelect.addEventListener('change', (e) => {
                targetUnitId = e.target.value;
                updateSymbols();
                calculateAll();
            });
            swapBtn.addEventListener('click', swapUnits);
        }

        // Render Category Tabs
        function renderTabs() {
            tabsContainer.innerHTML = '';
            Object.keys(unitData).forEach(key => {
                const cat = unitData[key];
                const button = document.createElement('button');
                button.className = `category-tab px-3 py-1.5 rounded-md font-medium text-xs sm:text-sm transition-all duration-150 flex items-center gap-1.5 ${
                    key === currentCategoryKey 
                        ? 'bg-brand-orange text-white shadow-md' 
                        : 'text-brand-textMuted hover:text-white hover:bg-brand-innerBg'
                }`;
                button.innerHTML = `<i class="fa-solid ${cat.icon} text-xs"></i>${cat.name}`;
                button.addEventListener('click', () => switchCategory(key));
                tabsContainer.appendChild(button);
            });
        }

        function switchCategory(key) {
            currentCategoryKey = key;
            renderTabs();

            const category = unitData[key];
            const units = category.units;

            // Populate selects
            sourceSelect.innerHTML = '';
            targetSelect.innerHTML = '';

            units.forEach(u => {
                const opt1 = new Option(`${u.name} (${u.symbol})`, u.id);
                const opt2 = new Option(`${u.name} (${u.symbol})`, u.id);
                sourceSelect.add(opt1);
                targetSelect.add(opt2);
            });

            // Set default selections
            sourceUnitId = units[1] ? units[1].id : units[0].id; // e.g. cm for length
            targetUnitId = units[4] ? units[4].id : (units[1] ? units[1].id : units[0].id); // e.g. in for length

            sourceSelect.value = sourceUnitId;
            targetSelect.value = targetUnitId;

            updateSymbols();
            calculateAll();
        }

        // Swap source & target
        function swapUnits() {
            const temp = sourceUnitId;
            sourceUnitId = targetUnitId;
            targetUnitId = temp;

            sourceSelect.value = sourceUnitId;
            targetSelect.value = targetUnitId;

            updateSymbols();
            calculateAll();
        }

        function updateSymbols() {
            const category = unitData[currentCategoryKey];
            const srcUnit = category.units.find(u => u.id === sourceUnitId);
            const tgtUnit = category.units.find(u => u.id === targetUnitId);

            sourceSymbolEl.textContent = srcUnit ? srcUnit.symbol : '';
            targetSymbolEl.textContent = tgtUnit ? tgtUnit.symbol : '';
        }

        // Convert from Value using source unit to target unit
        function convertValue(val, srcId, tgtId, categoryKey) {
            if (isNaN(val)) return 0;
            const cat = unitData[categoryKey];

            // Special handling for Temperature
            if (categoryKey === 'temperature') {
                return convertTemperature(val, srcId, tgtId);
            }

            // Special handling for Fuel Economy
            if (categoryKey === 'fuel') {
                return convertFuel(val, srcId, tgtId);
            }

            // Standard linear ratio calculation
            const srcUnit = cat.units.find(u => u.id === srcId);
            const tgtUnit = cat.units.find(u => u.id === tgtId);

            if (!srcUnit || !tgtUnit) return 0;

            const baseValue = val * srcUnit.ratio; // Convert to Base unit
            return baseValue / tgtUnit.ratio;      // Convert to Target unit
        }

        // Temperature Conversions
        function convertTemperature(val, from, to) {
            if (from === to) return val;
            
            // First to Celsius
            let celsius = val;
            if (from === 'F') celsius = (val - 32) * (5 / 9);
            else if (from === 'K') celsius = val - 273.15;
            else if (from === 'R') celsius = (val - 491.67) * (5 / 9);

            // From Celsius to Target
            if (to === 'C') return celsius;
            if (to === 'F') return celsius * (9 / 5) + 32;
            if (to === 'K') return celsius + 273.15;
            if (to === 'R') return (celsius + 273.15) * (9 / 5);

            return celsius;
        }

        // Fuel Economy Conversions
        function convertFuel(val, from, to) {
            if (from === to) return val;
            if (val === 0) return 0;

            // Convert to km/L first
            let km_l = val;
            if (from === 'l_100km') km_l = 100 / val;
            else if (from === 'mpg_us') km_l = val * 0.425144;
            else if (from === 'mpg_uk') km_l = val * 0.354006;

            // Convert from km/L to Target
            if (to === 'km_l') return km_l;
            if (to === 'l_100km') return 100 / km_l;
            if (to === 'mpg_us') return km_l / 0.425144;
            if (to === 'mpg_uk') return km_l / 0.354006;

            return km_l;
        }

        // Format Result Number cleanly
        function formatNumber(num) {
            if (num === 0) return "0";
            const absVal = Math.abs(num);

            // Use scientific notation for extremely small/large numbers like in the image (e.g. 6.2137e-6)
            if (absVal < 0.0001 || absVal >= 10000000) {
                return num.toExponential(5).replace(/\+e/, 'e');
            }

            // High precision for small numbers, clean rounding for standard numbers
            let formatted = num.toLocaleString('en-US', {
                maximumFractionDigits: 6,
                useGrouping: false
            });

            // If zero due to rounding, fall back to scientific
            if (formatted === "0" && num !== 0) {
                return num.toExponential(5);
            }

            return formatted;
        }

        // Main Calculate and Render function
        function calculateAll() {
            const rawVal = parseFloat(inputValueEl.value);
            const val = isNaN(rawVal) ? 0 : rawVal;

            // 1. Main Conversion Display
            const mainResult = convertValue(val, sourceUnitId, targetUnitId, currentCategoryKey);
            mainResultValueEl.textContent = formatNumber(mainResult);

            // 2. All Units Comparison Grid
            unitsGrid.innerHTML = '';
            const cat = unitData[currentCategoryKey];

            cat.units.forEach(u => {
                const converted = convertValue(val, sourceUnitId, u.id, currentCategoryKey);
                const formattedVal = formatNumber(converted);

                const card = document.createElement('div');
                card.className = `flex items-baseline space-x-1.5 p-1.5 rounded transition-colors ${
                    u.id === targetUnitId ? 'bg-brand-orange/10 border border-brand-orange/30' : 'hover:bg-brand-cardBg'
                }`;

                card.innerHTML = `
                    <span class="font-bold text-brand-orange text-sm sm:text-base tracking-wide">${formattedVal}</span>
                    <span class="text-xs sm:text-sm text-gray-300">${u.name}(${u.symbol})</span>
                `;

                unitsGrid.appendChild(card);
            });
        }

        // Start Application on Load
        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
