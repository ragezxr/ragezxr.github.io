<title>📝HTML-Editor.html</title>
<style>
:root{--bg:#e9e7e2;--bar:#f6f5f2;--bd:#c9c5bc;--tx:#26241f;--mut:#6f6b62;--ac:#1d5fa8;--hv:#dedbd3;--on:#cfdcec;--tag:#b3541e;--sheet:#fff;--sheet-tx:#1b1b1b}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1a;--bar:#2a2a27;--bd:#47453f;--tx:#e8e6e0;--mut:#9b978d;--ac:#7fb2ee;--hv:#3a3935;--on:#2f4562;--tag:#e8895a;--sheet:#fbfaf7;--sheet-tx:#1b1b1b}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--tx);font:13px/1.4 "Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;padding:5px 8px;background:var(--bar);border-bottom:1px solid var(--bd)}
.grp{display:flex;gap:2px;align-items:center;padding-right:6px;border-right:1px solid var(--bd)}
.grp:last-child{border:0}
button,select,input[type=color]{font:inherit;color:var(--tx);background:transparent;border:1px solid transparent;border-radius:4px;height:28px;min-width:28px;padding:0 7px;cursor:pointer}
select{border-color:var(--bd);background:var(--bar);padding:0 4px}
button:hover{background:var(--hv)}
button.on{background:var(--on);border-color:var(--ac)}
button:focus-visible,select:focus-visible,[role=tab]:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input[type=color]{padding:2px;width:30px;border-color:var(--bd)}
.file b{font-weight:600}
#main{flex:1;min-height:0;display:flex}#col{flex:1;min-width:0;display:flex;flex-direction:column}
#cm{display:none;position:fixed;z-index:99;min-width:190px;background:var(--bar);border:1px solid var(--bd);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.3);padding:4px 0}
#cm .mi{position:relative;display:flex;padding:5px 14px;gap:24px;cursor:pointer;white-space:nowrap}#cm .mi:hover{background:var(--on)}#cm .mi i{margin-left:auto;font-style:normal;color:var(--mut)}#cm .dis{opacity:.4;pointer-events:none}
#cm hr{border:0;border-top:1px solid var(--bd);margin:4px 0}#cm .sm{display:none;position:absolute;left:100%;top:-5px;min-width:170px;background:var(--bar);border:1px solid var(--bd);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.3);padding:4px 0}#cm .mi:hover>.sm{display:block}#cm .sm.l{left:auto;right:100%}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:120}
#dlg form{background:var(--bar);border:1px solid var(--bd);border-radius:8px;padding:16px 18px;min-width:440px;max-width:92vw;max-height:92vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#dlg.linkdlg form{width:min(900px,94vw);min-width:min(680px,94vw)}
#dlg textarea.longfield{display:block;width:100%;height:54px;min-height:54px;max-height:90px;resize:vertical;border:1px solid var(--bd);border-radius:5px;background:var(--bg);color:var(--tx);padding:9px;font:13px/1.5 ui-monospace,Consolas,"D2Coding",monospace;overflow-wrap:anywhere;white-space:pre-wrap}
#dlg .g:has(textarea.longfield){grid-template-columns:125px minmax(0,1fr)}
@media(max-width:650px){#dlg.linkdlg form{min-width:0;width:96vw}#dlg.linkdlg .g{grid-template-columns:1fr}#dlg.linkdlg .g label{margin-top:5px}}
#dlg h3{margin:0 0 10px;font-size:15px}#dlg .g{display:grid;grid-template-columns:160px 1fr;gap:6px 10px;align-items:center}#dlg .g label{color:var(--mut)}
#dlg input[type=text],#dlg input[type=number],#dlg select{height:28px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx);padding:0 6px;font:inherit;width:100%}
#dlg .cw{display:flex;gap:6px;align-items:center}#dlg .cw button{height:24px;border-color:var(--bd);font-size:11px}#dlg .b{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}#dlg .b button{border-color:var(--bd);padding:0 16px}
#toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:7px 14px;border-radius:6px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
#dt{display:none;height:28px;width:150px;border:1px solid var(--bd);border-radius:4px;background:var(--bar);color:var(--tx);padding:0 6px;font:inherit}
#tabs{display:flex;align-items:center;gap:0}#currentName{display:inline-flex;align-items:center;cursor:pointer;max-width:230px;min-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:6px;padding:4px 2px;border:0;border-radius:0;background:transparent;color:#22c55e;font:600 12px/1.2 ui-monospace,Consolas,monospace}#currentName.empty{color:#22c55e;font-style:italic;font-family:inherit;font-weight:500}
#nameMenu{position:fixed;z-index:99999;display:none;min-width:230px;max-width:min(320px,calc(100vw - 24px));padding:8px;background:var(--panel,#20242b);border:1px solid var(--bd);border-radius:9px;box-shadow:0 10px 32px #0008;color:var(--tx)}#nameMenu.open{display:block}#nameMenu .menuTitle{padding:7px 9px 9px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--bd);margin-bottom:5px;overflow-wrap:anywhere}#nameMenu button{display:block;width:100%;text-align:left;margin:3px 0;padding:8px 10px;height:auto;border:0;background:transparent;color:var(--tx);border-radius:5px}#nameMenu button:hover{background:var(--hover,#343a44)}#nameMenu button:disabled{opacity:.4;cursor:not-allowed}
#stage.flush{padding:0}#zw{min-height:100%}:where(#wys).wide{max-width:none;margin:0;padding:0;box-shadow:none;background:#fff;color:#000;font:medium serif;line-height:normal;overflow-wrap:normal}
#vopt{display:flex;gap:4px;margin-left:auto;padding-left:12px}#vopt select{height:20px;font-size:11px}
#stage{flex:1;min-height:0;position:relative;overflow:auto;padding:22px 12px}
/* 편집기 기본값은 우선순위를 낮춰(:where) 문서 자신의 body/html 스타일이 이기도록 함 */
:where(#wys){max-width:820px;min-height:100%;margin:0 auto;padding:48px 56px;background:var(--sheet);color:var(--sheet-tx);box-shadow:0 1px 3px rgba(0,0,0,.25);outline:none;font:16px/1.65 Georgia,"Noto Serif KR",serif;overflow-wrap:anywhere}
:where(#wys:not(.wide)) :where(img){max-width:100%;height:auto}
/* 열어 본 문서(.wide)는 브라우저 기본값 그대로 보이도록, 편집기 기본 스타일은 새 문서(시트)에만 적용 */
:where(#wys *){box-sizing:revert}:where(#wys).wide{box-sizing:content-box}
:where(#wys:not(.wide)) :where(table){max-width:100%;border-collapse:collapse}
:where(#wys:not(.wide)) :where(td,th){border:1px solid #999;padding:6px 10px;min-width:48px}
:where(#wys:not(.wide)) :where(blockquote){margin:1em 0;padding-left:1em;border-left:3px solid #bbb;color:#555}
:where(#wys:not(.wide)) :where(pre){background:#f2f0ea;padding:10px;overflow:auto}
:where(#wys:not(.wide)) :where(a){color:inherit}
/* 일반 편집 화면의 브라우저 기본 링크 파랑을 억제하되 문서가 지정한 링크 색상은 존중 */
#wys a:link,#wys a:visited{color:inherit}
#src{display:none;width:100%;height:100%;border:0;resize:none;padding:16px;background:var(--sheet);color:var(--sheet-tx);font:13px/1.55 ui-monospace,Consolas,"D2Coding",monospace;tab-size:2;outline:none}
#prev{display:none;width:100%;height:100%;border:0;background:#fff}
.m-src #wys,.m-prev #wys{display:none}.m-src #src{display:block}.m-prev #prev{display:block}
.m-src #stage,.m-prev #stage{padding:0;overflow:hidden}
.m-src .fmt,.m-prev .fmt{opacity:.4;pointer-events:none}
/* 태그 보기 */
#wys.tags *{position:relative}
#wys.tags :is(p,div,h1,h2,h3,h4,h5,h6,ul,ol,li,table,tr,td,th,blockquote,pre,a,b,i,u,strong,em,span,font,hr,img,s,strike){outline:1px dashed color-mix(in srgb,var(--tag) 55%,transparent);outline-offset:1px;margin-top:.55em;}
#wys.tags :is(p,div,h1,h2,h3,h4,h5,h6,ul,ol,li,table,tr,td,th,blockquote,pre,a,b,i,u,strong,em,span,font,hr,img,s,strike)::before{content:"<" attr(data-n) ">";font:600 10px/1 ui-monospace,monospace;color:#fff;background:var(--tag);padding:1px 4px;border-radius:2px;position:absolute;top:-.95em;left:0;z-index:2;pointer-events:none}
#crumb{display:flex;gap:2px;align-items:center;padding:3px 8px;background:var(--bar);border-top:1px solid var(--bd);min-height:26px;overflow-x:auto;white-space:nowrap}
#crumb button{height:20px;min-width:0;padding:0 6px;font:600 11px ui-monospace,Consolas,monospace;color:var(--tag);border:1px solid var(--bd)}
#crumb span.sep{color:var(--mut)}
#info{margin-left:8px;color:var(--mut);padding-left:12px}
#tabs{display:flex;background:var(--bar);border-top:1px solid var(--bd)}
[role=tab]{border-radius:0;height:30px;padding:0 18px;border:0;border-right:1px solid var(--bd);color:var(--mut)}
[role=tab][aria-selected=true]{background:var(--bg);color:var(--tx);font-weight:600;box-shadow:inset 0 -2px var(--ac)}

body{font-size:12px}.bar{gap:1px 3px;padding:2px 5px}.grp{gap:1px;padding-right:3px}
button,select,input[type=color]{height:23px;min-width:23px;padding:0 4px;border-radius:3px}select{padding:0 1px}input[type=color]{width:23px;padding:1px}
#fnt{width:118px!important}#siz{width:46px;height:23px;border:1px solid var(--bd);background:var(--bar);color:var(--tx);border-radius:3px;text-align:center;padding:0}
.tc{display:none}.in-tbl .tc{display:inline-block}

#side{display:none;width:190px;flex:none;overflow:auto;background:var(--bar);border-right:1px solid var(--bd);padding:3px 0;font-size:11px;color:var(--mut)}.outl #side{display:block}
#side a{display:block;padding:2px 8px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-size:12px}#side a:hover{background:var(--hv)}
#pal{position:fixed;inset:0;z-index:130;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;background:rgba(0,0,0,.25)}
#pal>div{width:min(460px,92vw);background:var(--bar);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.4);overflow:hidden}
#pal input{width:100%;height:32px;border:0;border-bottom:1px solid var(--bd);background:transparent;color:var(--tx);padding:0 10px;font:inherit;outline:none}
#pal ul{list-style:none;margin:0;padding:3px;max-height:50vh;overflow:auto}#pal li{display:flex;justify-content:space-between;padding:4px 8px;border-radius:4px;cursor:pointer}#pal li.on{background:var(--on)}#pal li i{font-style:normal;color:var(--mut);font-size:11px}
#tg{position:fixed;z-index:140;background:var(--bar);border:1px solid var(--bd);border-radius:6px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#tg .gr{display:grid;grid-template-columns:repeat(8,16px);gap:2px}#tg i{width:16px;height:16px;border:1px solid var(--bd);background:var(--bg)}#tg i.on{background:var(--ac);border-color:var(--ac)}#tg .lb{text-align:center;font-size:11px;margin-top:4px;color:var(--mut)}
.zen .bar,.zen #crumb,.zen #tabs,.zen #side{display:none}
@media print{body{display:block;overflow:visible;background:#fff}.bar,#crumb,#tabs,#side,#cm,#toast,#pal,#tg{display:none!important}#stage{overflow:visible;padding:0}#zw{zoom:1!important}#wys{box-shadow:none;max-width:none;padding:0}}
#sl,#ft{position:fixed;z-index:135;background:var(--bar);border:1px solid var(--bd);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#sl{min-width:170px;max-height:260px;overflow:auto;padding:3px}#sl div{padding:3px 8px;border-radius:4px;cursor:pointer}#sl div.on{background:var(--on)}
#ft{display:none;padding:2px;gap:1px}#ft.show{display:flex}#ft button{height:22px}
.paint #wys{cursor:copy}
#gut{display:none;position:absolute;left:0;top:0;bottom:0;width:44px;overflow:hidden;pointer-events:none;background:var(--bar);color:var(--mut);border-right:1px solid var(--bd);font:13px/1.55 ui-monospace,Consolas,"D2Coding",monospace;text-align:right;padding:16px 6px;white-space:pre}
.m-src #gut{display:block}#src{padding-left:54px;white-space:pre;overflow:auto}
:root{--ui:1}
.bar,#crumb,#tabs,#side,#pal>div{zoom:var(--ui)}#dlg form{zoom:var(--ui);max-height:calc(92vh/var(--ui))}
#cm,#nameMenu,#tg,#ft,#sl,#colorPalette,#uip{transform:scale(var(--ui));transform-origin:0 0}

function queueEditorSelectionRefresh(){

}
document.addEventListener('selectionchange',()=>{
  const s=getSelection();

/* 클릭·마우스 이동으로 캐럿 위치가 바뀐 경우에도 글꼴 표시를 즉시 갱신 */

/* 고급 색상 기준표: 표준 색상 + 회색조 + 사용자 지정 색상 */

 ['웹 UI 색상',[['Primary','#2563eb'],['Primary hover','#1d4ed8'],['Success','#16a34a'],['Warning','#d97706'],['Danger','#dc2626'],['Info','#0891b2'],['보라','#7c3aed'],['핑크','#db2777'],['배경 밝음','#f8fafc'],['카드 밝음','#ffffff'],['테두리 밝음','#cbd5e1'],['본문 글자','#0f172a']]],

function showPalette(id){
 const old=document.getElementById('colorPalette');if(old)old.remove();const input=$('#'+id),cmd=id=='fc'?'foreColor':'hiliteColor';
 const box=document.createElement('div');box.id='colorPalette';box.style.cssText='position:fixed;z-index:150;width:min(390px,94vw);max-height:75vh;overflow:auto;padding:12px;background:var(--bar);color:var(--tx);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 28px #0005';
 const head=document.createElement('div');head.textContent=id=='fc'?'글자색 기준표':'배경색 기준표';head.style.cssText='font-weight:700;margin-bottom:8px';box.append(head);
 paletteColors.forEach(([name,colors])=>{const title=document.createElement('div');title.textContent=name;title.style.cssText='font-size:11px;color:var(--mut);margin:8px 0 4px';box.append(title);const row=document.createElement('div');row.style.cssText='display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px';colors.forEach(([label,color])=>{const sw=document.createElement('button');sw.type='button';sw.title=label+' · '+color;sw.setAttribute('aria-label',label+' '+color);sw.style.cssText='height:28px;min-width:0;padding:0;background:'+color+';border:1px solid '+(['#ffffff','#ffff00','#f5f5f5','#eeeeee'].includes(color.toLowerCase())?'#999':'#0002')+';border-radius:4px';sw.onclick=()=>{input.value=color;input.dispatchEvent(new Event('input',{bubbles:true}));box.remove()};row.append(sw)});box.append(row)});
 const custom=document.createElement('div');custom.style.cssText='display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--bd)';const picker=document.createElement('input');picker.type='color';picker.value=input.value;picker.style.cssText='width:42px;height:30px';const apply=document.createElement('button');apply.type='button';apply.textContent='사용자 지정 색상 적용';apply.onclick=()=>{input.value=picker.value;input.dispatchEvent(new Event('input',{bubbles:true}));box.remove()};custom.append(picker,apply);box.append(custom);
 document.body.append(box);const r=input.getBoundingClientRect();box.style.left=Math.max(8,Math.min(r.left,innerWidth-box.offsetWidth-8))+'px';box.style.top=up(box,r,5)+'px';
 const dismiss=e=>{if(!box.contains(e.target)&&e.target!==input&&!e.target.closest('[data-palette]')){box.remove();document.removeEventListener('pointerdown',dismiss,true)}};setTimeout(()=>document.addEventListener('pointerdown',dismiss,true),0);
}
$('#bLink').onclick=()=>link();
wys.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();link();}});
function link(forceAnchor=null){
  restore();
  const s=getSelection();let n=s.rangeCount?s.getRangeAt(0).startContainer:null;n=n&&(n.nodeType===1?n:n.parentElement);
  const a=forceAnchor||(n&&n.closest?n.closest('a'):null);
  const r=s.rangeCount?s.getRangeAt(0).cloneRange():null;
  const selectedText=r&&!r.collapsed?r.toString():'';
  const safeUrl=u=>{u=(u||'').trim();if(!u)return'';if(/^(javascript|vbscript|data):/i.test(u))return null;return u};
  dlg(a?'링크 편집 — 고급 옵션':'링크 삽입 — 고급 옵션',[
    {l:'링크 주소 (URL)',id:'url',t:'longtext',v:a?a.getAttribute('href')||'':'' ,h:'주소가 길면 여러 줄로 표시됩니다. https://, mailto:, tel:, #앵커 등을 사용할 수 있습니다.'},
    {l:'표시 텍스트',id:'text',v:a?a.textContent:selectedText,h:'선택 영역이 없으면 여기에 입력한 텍스트로 링크를 만듭니다.'},
    {l:'링크 설명 (title)',id:'title',v:a?a.getAttribute('title')||'':''},
    {l:'열기 방식',id:'target',t:'sel',v:a?a.getAttribute('target')||'_blank':'_blank',o:[['_blank','새 탭/창'],['_self','현재 탭'],['_parent','상위 프레임'],['_top','최상위 프레임']]},
    {l:'보안 속성 rel',id:'rel',v:a?a.getAttribute('rel')||'noopener noreferrer':'noopener noreferrer',h:'예: noopener noreferrer, nofollow'},
    {l:'다운로드 링크',id:'download',t:'chk',v:!!(a&&a.hasAttribute('download'))},
    {l:'CSS 클래스',id:'class',v:a?a.getAttribute('class')||'':''}
  ],v=>{
    const url=safeUrl(v.url);if(url===null){toast('javascript:, vbscript:, data: 주소는 보안상 허용되지 않습니다.');return}if(!url){toast('링크 주소를 입력하세요.');return}
    snap();restore();let anchor=a&&wys.contains(a)?a:null;
    if(anchor){anchor.setAttribute('href',url);if(v.text!==anchor.textContent&&v.text.trim())anchor.textContent=v.text;}
    else{
      const sel=getSelection();let range=sel.rangeCount?sel.getRangeAt(0):null;
      if(range&&!range.collapsed){const frag=range.extractContents();anchor=document.createElement('a');anchor.append(frag);range.insertNode(anchor);}
      else{anchor=document.createElement('a');anchor.textContent=v.text||url;if(range){range.insertNode(anchor);range.setStartAfter(anchor);range.collapse(true);sel.removeAllRanges();sel.addRange(range)}else wys.append(anchor)}
    }
    anchor.setAttribute('href',url);if(v.title)anchor.setAttribute('title',v.title);else anchor.removeAttribute('title');
    if(v.target)anchor.setAttribute('target',v.target);else anchor.removeAttribute('target');
    if(v.rel)anchor.setAttribute('rel',v.rel);else anchor.removeAttribute('rel');
    if(v.download)anchor.setAttribute('download','');else anchor.removeAttribute('download');
    if(v.class.trim())anchor.setAttribute('class',v.class.trim());else anchor.removeAttribute('class');
    dirty=true;after();
  });
}
$('#bFindReplace').onclick=()=>{
  dlg('본문 찾기 및 바꾸기',[{l:'찾을 내용',id:'find',v:''},{l:'바꿀 내용',id:'replace',v:''},{l:'대소문자 구분',id:'case',t:'chk',v:false}],v=>{
    if(!v.find){toast('찾을 내용을 입력하세요.');return}let count=0;const needle=v.case?v.find:v.find.toLocaleLowerCase();
    const walker=document.createTreeWalker(wys,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest('script,style,textarea,code')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    snap();nodes.forEach(n=>{const srcText=n.nodeValue,cmp=v.case?srcText:srcText.toLocaleLowerCase();if(!cmp.includes(needle))return;let out='',at=0,pos;while((pos=cmp.indexOf(needle,at))!==-1){out+=srcText.slice(at,pos)+v.replace;at=pos+v.find.length;count++}if(count)out+=srcText.slice(at);if(out!==srcText)n.nodeValue=out});
    if(count){dirty=true;after();toast(count+'곳을 바꿨습니다.')}else toast('일치하는 내용을 찾지 못했습니다.');
  });
};
function showDocumentStats(){const text=wys.innerText||'',words=(text.trim().match(/\S+/g)||[]).length;toast('글자 '+text.length+'자 · 단어 '+words+'개 · 문단 '+wys.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li').length+'개 · 링크 '+wys.querySelectorAll('a').length+'개 · 이미지 '+wys.querySelectorAll('img').length+'개 · 표 '+wys.querySelectorAll('table').length+'개');}
$('#bDate').onclick=()=>{restore();const d=new Date(),v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');document.execCommand('insertText',false,v);after();dirty=true;};

/* 표 */
$('#bTbl').onclick=()=>{

$$('[data-t]').forEach(b=>b.onclick=()=>{
  const s=getSelection();if(!s.rangeCount)return;
  let n=s.anchorNode;n=n.nodeType==1?n:n.parentNode;
  const td=n.closest('td,th'),tb=n.closest('table');
  if(!td||!wys.contains(td)){alert('표 안의 칸을 먼저 클릭하세요.');return;}
  snap();const tr=td.parentNode,ci=td.cellIndex,k=b.dataset.t;
  if(k=='row+'){const nr=tr.cloneNode(true);[...nr.cells].forEach(x=>x.innerHTML='<br>');tr.after(nr);}
  if(k=='row-'){tb.rows.length>1?tr.remove():tb.remove();}
  if(k=='col+'){[...tb.rows].forEach(r=>{const x=r.cells[ci].cloneNode(false);x.innerHTML='<br>';r.cells[ci].after(x);});}
  if(k=='col-'){tr.cells.length>1?[...tb.rows].forEach(r=>r.cells[ci]&&r.deleteCell(ci)):tb.remove();}
  if(k=='del')tb.remove();
  after();
});

wys.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='k'){e.preventDefault();link();}

/* 상태 표시: 태그 경로, 글자 수, 서식 버튼 */
function crumbs(){
  path.textContent='';
  const s=getSelection();if(!s.rangeCount||!wys.contains(s.anchorNode))return;
  let n=s.anchorNode;n=n.nodeType==1?n:n.parentNode;
  const ch=[];
  while(n&&n!==wys){ch.unshift(n);n=n.parentNode;}
  ch.forEach((el,i)=>{
    if(i){const sp=document.createElement('span');sp.className='sep';sp.textContent='›';path.append(sp);}
    const b=document.createElement('button');b.textContent='<'+el.tagName.toLowerCase()+'>';
    b.onmousedown=e=>e.preventDefault();
    b.onclick=()=>{wys.focus();const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);};
    path.append(b);
  });
}
function counts(){const t=wys.innerText,c=t.replace(/\s/g,'').length,w=(t.match(/\S+/g)||[]).length;info.textContent='글자 '+c.toLocaleString('ko-KR')+' · 단어 '+w.toLocaleString('ko-KR')+' · 약 '+Math.max(1,Math.round(c/500))+'분'}
function updateFontDisplay(){
  const sel=getSelection();let node=sel&&sel.rangeCount?sel.anchorNode:null;
  if(node&&node.nodeType===Node.TEXT_NODE)node=node.parentElement;
  if(!node||!wys.contains(node))node=wys;
  const activeRange=sel&&sel.rangeCount?sel.getRangeAt(0):null;
  let hit=node;
  if(activeRange&&!activeRange.collapsed){let c=activeRange.commonAncestorContainer;if(c&&c.nodeType===Node.TEXT_NODE)c=c.parentElement;if(c&&wys.contains(c))hit=c;}
  const cell=hit.closest&&hit.closest('td,th');const table=hit.closest&&hit.closest('table');
  let fonts=[];let label='현재 글꼴';
  if(cell){fonts=[getComputedStyle(cell).fontFamily];label='셀 글꼴';}
  else if(table){fonts=[...table.querySelectorAll('td,th')].map(x=>getComputedStyle(x).fontFamily);label='표 글꼴';}
  else if(!sel||sel.isCollapsed){fonts=[getComputedStyle(node).fontFamily];}
  else {
    const r=sel.getRangeAt(0);let root=r.commonAncestorContainer;if(root.nodeType===Node.TEXT_NODE)root=root.parentElement;
    const els=[];if(root&&root.nodeType===1)els.push(root);if(root&&root.querySelectorAll)els.push(...root.querySelectorAll('*'));
    const relevant=els.filter(el=>{try{return r.intersectsNode(el)&&wys.contains(el)}catch(_){return false}});
    fonts=(relevant.length?relevant:[node]).map(el=>getComputedStyle(el).fontFamily);
  }
  fonts=[...new Set(fonts.filter(Boolean).map(f=>f.split(',')[0].trim().replace(/^['"]|['"]$/g,'')))];
  const select=$('#fnt');if(!select)return;
  let name=fonts.length===1?fonts[0]:(fonts.length>1?'혼합 글꼴':'기본 글꼴');

function keepIn(el){
  if(!el||!el.isConnected)return;const cs=getComputedStyle(el);if(cs.display=='none'||cs.position!='fixed')return;
  const r=el.getBoundingClientRect();let dx=0,dy=0;
  if(r.right>innerWidth-4)dx=innerWidth-4-r.right;if(r.left+dx<4)dx=4-r.left;
  if(r.bottom>innerHeight-4)dy=innerHeight-4-r.bottom;if(r.top+dy<4)dy=4-r.top;
  if(dx||dy){el.style.left=(parseFloat(el.style.left||cs.left)||0)+dx+'px';el.style.top=(parseFloat(el.style.top||cs.top)||0)+dy+'px'}}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType==1&&n.matches('#cpk,#cpp,#tg,#uip,#tcm,#tvp,#sl,#mo'))requestAnimationFrame(()=>keepIn(n))}))).observe(document.body,{childList:true});
new MutationObserver(()=>{if(cm.style.display=='block')keepIn(cm)}).observe(cm,{attributes:true,attributeFilter:['style']});
addEventListener('resize',()=>$$('#cpk,#cpp,#tg,#uip,#tcm,#tvp,#mo,#cm,#nameMenu').forEach(keepIn));
cm.addEventListener('mouseover',e=>{const mi=e.target.closest('.mi'),sm=mi&&mi.querySelector(':scope>.sm');if(!sm)return;
  requestAnimationFrame(()=>{sm.style.top='';let r=sm.getBoundingClientRect();const t=parseFloat(getComputedStyle(sm).top)||0;
    if(r.bottom>innerHeight-4)sm.style.top=(t-(r.bottom-innerHeight+4))+'px';r=sm.getBoundingClientRect();if(r.top<4)sm.style.top=((parseFloat(sm.style.top)||t)+(4-r.top))+'px'})});

  [...MH].forEach(k=>{if(k.startsWith('D:')){const n='D:'+normLab(k.slice(2));if(n!==k){MH.delete(k);MH.add(n)}}});
