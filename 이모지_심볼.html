function applyUnifiedNameToggleUi(doc){if(!doc)return;const en=doc.getElementById('toggleEnglishNames'),ko=doc.getElementById('toggleKoreanNames');if(en)en.setAttribute('aria-pressed',String(unifiedShowEnglish));if(ko)ko.setAttribute('aria-pressed',String(unifiedShowKorean));const section=doc.getElementById('unifiedInlineSearch');if(section){section.classList.toggle('show-unified-english',unifiedShowEnglish);section.classList.toggle('show-unified-korean',unifiedShowKorean);}}
function attachUnifiedNameToggleHandlers(mode){const doc=frames[mode]?.contentDocument;if(!doc)return;const en=doc.getElementById('toggleEnglishNames'),ko=doc.getElementById('toggleKoreanNames');if(unifiedToggleSession&&!unifiedOriginalToggleStates[mode]&&en&&ko)unifiedOriginalToggleStates[mode]={english:en.getAttribute('aria-pressed')==='true',korean:ko.getAttribute('aria-pressed')==='true'};if(!unifiedToggleHandlersAttached[mode]&&en&&ko){const toggle=(kind,ev)=>{if(!unifiedToggleSession)return;ev.preventDefault();ev.stopImmediatePropagation();if(kind==='english')unifiedShowEnglish=!unifiedShowEnglish;else unifiedShowKorean=!unifiedShowKorean;for(const m of ['emoji','special'])applyUnifiedNameToggleUi(frames[m]?.contentDocument);};en.addEventListener('click',ev=>toggle('english',ev),true);ko.addEventListener('click',ev=>toggle('korean',ev),true);unifiedToggleHandlersAttached[mode]=true;}if(unifiedToggleSession)applyUnifiedNameToggleUi(doc);}
function beginUnifiedToggleSession(){if(unifiedToggleSession)return;unifiedToggleSession=true;unifiedShowEnglish=true;unifiedShowKorean=true;for(const mode of ['emoji','special'])attachUnifiedNameToggleHandlers(mode);}
function endUnifiedToggleSession(){if(!unifiedToggleSession)return;unifiedToggleSession=false;for(const mode of ['emoji','special']){const doc=frames[mode]?.contentDocument;const saved=unifiedOriginalToggleStates[mode];if(doc&&saved){const en=doc.getElementById('toggleEnglishNames'),ko=doc.getElementById('toggleKoreanNames');if(en)en.setAttribute('aria-pressed',String(saved.english));if(ko)ko.setAttribute('aria-pressed',String(saved.korean));const section=doc.getElementById('unifiedInlineSearch');if(section)section.classList.remove('show-unified-english','show-unified-korean');}delete unifiedOriginalToggleStates[mode];}}
function getInlineSearchHost(){const frame=frames[currentMode];if(!frame||!frame.contentDocument)return null;const doc=frame.contentDocument;const page=doc.querySelector('.page');const header=page?.querySelector('.top-panel');const main=page?.querySelector('main');if(!page||!header||!main)return null;let section=doc.getElementById('unifiedInlineSearch');if(!section){section=doc.createElement('section');section.id='unifiedInlineSearch';section.setAttribute('aria-label','이모지와 심볼 통합 검색 결과');section.innerHTML='<div class="unified-inline-head"><strong id="unifiedInlineSummary">통합 검색 결과</strong><span>짧게 누르기: 복사 · 길게 누르기: 원래 위치</span></div><div class="unified-inline-groups" id="unifiedInlineGroups"></div>';header.insertAdjacentElement('afterend',section);const style=doc.createElement('style');style.id='unifiedInlineSearchStyle';style.textContent='#unifiedInlineSearch{margin:0 0 16px;padding:10px;border:1px solid var(--line,#303a49);border-radius:13px;background:var(--panel,#191e28);color:var(--text,#eef2f8)}#unifiedInlineSearch[hidden]{display:none!important}#unifiedInlineSearch:not(.show-unified-english) .unified-inline-english{display:none!important}#unifiedInlineSearch:not(.show-unified-korean) .unified-inline-korean{display:none!important}#unifiedInlineSearch:not(.show-unified-english) .unified-inline-name-separator,#unifiedInlineSearch:not(.show-unified-korean) .unified-inline-name-separator{display:none!important}.unified-inline-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:5px 10px;margin:0 0 9px;color:var(--accent2,#b8d5ff);font-size:.8rem}.unified-inline-head span{color:var(--muted,#9ca9ba);font-size:.68rem;font-weight:500}.unified-inline-group{margin-top:10px}.unified-inline-group:first-child{margin-top:0}.unified-inline-group-title{margin:0 0 6px;padding:0 2px;color:var(--text,#eef2f8);font-size:.85rem;font-weight:850}.unified-inline-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:5px}.unified-inline-item{display:grid;grid-template-columns:38px minmax(0,1fr);align-items:center;gap:7px;min-width:0;min-height:49px;padding:6px;border:1px solid var(--line,#303a49);border-radius:9px;background:var(--panel2,#202735);color:var(--text,#eef2f8);text-align:left;cursor:pointer}.unified-inline-item:hover{border-color:var(--accent,#85b7ff)}.unified-inline-glyph{font-size:24px;text-align:center}.unified-inline-meta{min-width:0}.unified-inline-name{display:block;font-size:.73rem;font-weight:750;overflow-wrap:anywhere;line-height:1.25}.unified-inline-sub{display:block;margin-top:3px;color:var(--muted,#9ca9ba);font-size:.62rem;overflow-wrap:anywhere;line-height:1.25}.unified-inline-empty{padding:20px 8px;color:var(--muted,#9ca9ba);text-align:center;font-size:.85rem}@media(max-width:560px){#unifiedInlineSearch{padding:7px;border-radius:10px}.unified-inline-list{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px}.unified-inline-item{grid-template-columns:32px minmax(0,1fr);gap:5px;padding:5px;min-height:44px}.unified-inline-glyph{font-size:22px}.unified-inline-name{font-size:.69rem}.unified-inline-sub{font-size:.59rem}}';doc.head.appendChild(style);}inlineSearchDoc=doc;return {doc,page,header,main,section};}
function setInlineSearchVisibility(active){if(active&&!unifiedToggleSession)beginUnifiedToggleSession();if(!active&&unifiedToggleSession)endUnifiedToggleSession();for(const mode of ['emoji','special']){const frame=frames[mode];if(!frame||!frame.contentDocument)continue;const doc=frame.contentDocument;attachUnifiedNameToggleHandlers(mode);const page=doc.querySelector('.page');const main=page?.querySelector('main');const header=page?.querySelector('.top-panel');if(main)main.hidden=active&&mode===currentMode;if(header){for(const selector of ['.filter-area','.subcategory-area','.quick-info','.status-toolbar'])header.querySelectorAll(selector).forEach(el=>{if(active){if(el.dataset.unifiedOriginalHidden===undefined)el.dataset.unifiedOriginalHidden=String(el.hidden);el.hidden=true;}else if(el.dataset.unifiedOriginalHidden!==undefined){el.hidden=el.dataset.unifiedOriginalHidden==='true';delete el.dataset.unifiedOriginalHidden;}});}const section=doc.getElementById('unifiedInlineSearch');if(section){if(mode!==currentMode)section.hidden=true;if(active)applyUnifiedNameToggleUi(doc);}}}
function syncUnifiedQuery(query){unifiedQuery=String(query||'');if(!unifiedQuery.trim()){unifiedItems={emoji:[],special:[]};for(const mode of ['emoji','special']){const frame=frames[mode];if(frame?.contentWindow)frame.contentWindow.postMessage({type:'explorer-unified-query',query:''},'*');}setInlineSearchVisibility(false);const host=getInlineSearchHost();if(host)host.section.hidden=true;return;}ensureLoaded('emoji');ensureLoaded('special');setInlineSearchVisibility(true);for(const mode of ['emoji','special']){const frame=frames[mode];if(frame?.contentWindow)frame.contentWindow.postMessage({type:'explorer-unified-query',query:unifiedQuery},'*');}renderUnifiedResults();}
function renderUnifiedResults(){if(!unifiedQuery.trim()){const host=getInlineSearchHost();if(host)host.section.hidden=true;return;}const host=getInlineSearchHost();if(!host)return;setInlineSearchVisibility(true);host.section.hidden=false;const summary=host.doc.getElementById('unifiedInlineSummary');const list=host.doc.getElementById('unifiedInlineGroups');if(!summary||!list)return;const order=[currentMode,currentMode==='emoji'?'special':'emoji'];const total=order.reduce((n,mode)=>n+(unifiedItems[mode]?.length||0),0);summary.textContent=`통합 검색 결과 ${total.toLocaleString('ko-KR')}개${total>=500?' 이상':''}`;list.replaceChildren();if(!total){const empty=host.doc.createElement('div');empty.className='unified-inline-empty';empty.textContent='검색 결과를 불러오는 중이거나 일치하는 항목이 없습니다.';list.appendChild(empty);return;}for(const mode of order){const items=unifiedItems[mode]||[];if(!items.length)continue;const group=host.doc.createElement('section');group.className='unified-inline-group';const heading=host.doc.createElement('h2');heading.className='unified-inline-group-title';heading.textContent=`${mode==='emoji'?'✨ 이모지':'🔣 심볼'} · ${items.length.toLocaleString('ko-KR')}개`;const grid=host.doc.createElement('div');grid.className='unified-inline-list';for(const item of items.slice(0,250)){const btn=host.doc.createElement('button');btn.type='button';btn.className='unified-inline-item';btn.title='짧게 누르기: 복사 / 길게 누르기: 원래 위치로 이동';const glyph=host.doc.createElement('span');glyph.className='unified-inline-glyph';glyph.textContent=item.glyph||item.value||'';const meta=host.doc.createElement('span');meta.className='unified-inline-meta';const name=host.doc.createElement('span');name.className='unified-inline-name';const koName=host.doc.createElement('span');koName.className='unified-inline-korean';koName.textContent=item.ko||'';const enName=host.doc.createElement('span');enName.className='unified-inline-english';enName.textContent=item.en||'';if(koName.textContent)name.appendChild(koName);if(enName.textContent){if(koName.textContent){const sep=host.doc.createElement('span');sep.className='unified-inline-name-separator';sep.textContent=' · ';name.appendChild(sep);}name.appendChild(enName);}if(!name.childNodes.length)name.textContent=item.glyph||item.value||'';const sub=host.doc.createElement('span');sub.className='unified-inline-sub';sub.textContent=`${item.category||''}${item.sub?' · '+item.sub:''}${item.cp?' · '+item.cp:''}`;meta.append(name,sub);btn.append(glyph,meta);btn.addEventListener('pointerdown',ev=>{if(ev.pointerType==='mouse'&&ev.button!==0)return;unifiedLongPressed=false;clearTimeout(unifiedPressTimer);unifiedPressTimer=setTimeout(()=>{unifiedLongPressed=true;syncUnifiedQuery('');setMode(item.mode);frames[item.mode].contentWindow.postMessage({type:'explorer-search-action',action:'navigate',mode:item.mode,value:item.value},'*');},620);});for(const ev of ['pointerup','pointerleave','pointercancel'])btn.addEventListener(ev,()=>clearTimeout(unifiedPressTimer));btn.addEventListener('click',ev=>{if(unifiedLongPressed){unifiedLongPressed=false;ev.preventDefault();ev.stopPropagation();return;}frames[item.mode].contentWindow.postMessage({type:'explorer-search-action',action:'copy',mode:item.mode,value:item.value},'*');});btn.addEventListener('contextmenu',ev=>{ev.preventDefault();clearTimeout(unifiedPressTimer);syncUnifiedQuery('');setMode(item.mode);frames[item.mode].contentWindow.postMessage({type:'explorer-search-action',action:'navigate',mode:item.mode,value:item.value},'*');});grid.appendChild(btn);}group.append(heading,grid);list.appendChild(group);}}
window.addEventListener('message',event=>{const d=event.data;if(!d)return;if(d.type==='explorer-search-query'){syncUnifiedQuery(d.query||'');return;}if(d.type!=='explorer-search-results'||!['emoji','special'].includes(d.mode))return;if(String(d.query||'').trim()!==unifiedQuery.trim())return;unifiedItems[d.mode]=Array.isArray(d.items)?d.items:[];renderUnifiedResults();});

async function readSource(id) {
  const node = document.getElementById(id);
  const bin = atob(node.textContent.trim());
  node.remove();
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
// 화면에 필요한 페이지만 로드합니다. 심볼 페이지는 처음 열거나 전환 버튼에 닿을 때 압축을 풀어 만들어집니다.
function ensureLoaded(mode) {
  if (!Object.prototype.hasOwnProperty.call(frames, mode) || loaded[mode]) return;
  loaded[mode] = true;
  frames[mode].addEventListener('load',()=>{attachUnifiedNameToggleHandlers(mode);if(unifiedQuery.trim()){const input=frames[mode].contentDocument?.getElementById('searchInput');if(input&&input.value!==unifiedQuery){input.value=unifiedQuery;const clear=frames[mode].contentDocument.getElementById('clearHeaderSearch');if(clear)clear.hidden=false;input.dispatchEvent(new Event('input',{bubbles:true}));}frames[mode].contentWindow.postMessage({type:'explorer-unified-query',query:unifiedQuery},'*');}});
  readSource('src-' + mode).then(html => { frames[mode].srcdoc = html; }).catch(() => {
    frames[mode].srcdoc = '<meta charset="utf-8"><body style="margin:2rem;font:16px system-ui;color:#eef2f8;background:#10151d">이 브라우저는 압축 해제(DecompressionStream)를 지원하지 않습니다. 최신 Chrome·Edge·Safari 16.4+·Firefox 113+에서 열어 주세요.</body>';
  });
}
function setMode(mode) {
  if (!Object.prototype.hasOwnProperty.call(frames, mode)) return;
  currentMode = mode;
  for (const [name, frame] of Object.entries(frames)) frame.classList.toggle('active', name === mode);
  ensureLoaded(mode);
  if(unifiedQuery.trim()){const input=frames[mode].contentDocument?.getElementById('searchInput');if(input&&input.value!==unifiedQuery){input.value=unifiedQuery;const clear=frames[mode].contentDocument.getElementById('clearHeaderSearch');if(clear)clear.hidden=false;input.dispatchEvent(new Event('input',{bubbles:true}));}}
  try { localStorage.setItem(MODE_KEY, mode); } catch (_) {}
  document.title = '✨ 이모지 & 🔣 심볼';
  if(unifiedQuery.trim()){setInlineSearchVisibility(true);renderUnifiedResults();}
}
// 마지막으로 보던 화면(이모지/심볼)에서 다시 시작합니다.
let startMode = 'emoji';
try { const saved = localStorage.getItem(MODE_KEY); if (saved === 'emoji' || saved === 'special') startMode = saved; } catch (_) {}
setMode(startMode);
window.addEventListener('message', (event) => {
  if (event.source !== emojiFrame.contentWindow && event.source !== specialFrame.contentWindow) return;
  const data = event.data;
  if (!data) return;
  if (data.type === 'explorer-switch-mode' && (data.mode === 'emoji' || data.mode === 'special')) setMode(data.mode);
  else if (data.type === 'explorer-prefetch' && (data.mode === 'emoji' || data.mode === 'special')) ensureLoaded(data.mode);
});
document.addEventListener('input',event=>{if(event.target&&event.target.classList&&event.target.classList.contains('header-search'))syncUnifiedQuery(event.target.value);});
