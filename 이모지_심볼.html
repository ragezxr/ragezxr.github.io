<script id="remember-last-position-emoji">
(() => {
  const storageKey = 'emoji-symbol-last-scroll-emoji-v1';
  let saveFrame = 0;
  const savePosition = () => {
    try { localStorage.setItem(storageKey, String(Math.max(0, window.scrollY || document.documentElement.scrollTop || 0))); } catch (_) {}
  };
  window.addEventListener('scroll', () => {
    if (saveFrame) cancelAnimationFrame(saveFrame);
    saveFrame = requestAnimationFrame(() => { saveFrame = 0; savePosition(); });
  }, { passive: true });
  window.addEventListener('pagehide', savePosition);
  const restorePosition = () => {
    try {
      const saved = Number(localStorage.getItem(storageKey));
      if (Number.isFinite(saved) && saved > 0) window.scrollTo({ top: saved, left: 0, behavior: 'instant' });
    } catch (_) {}
  };
  window.addEventListener('load', () => {
    requestAnimationFrame(() => { restorePosition(); setTimeout(restorePosition, 180); setTimeout(restorePosition, 650); });
  });
  if (document.readyState === 'complete') { requestAnimationFrame(() => { restorePosition(); setTimeout(restorePosition, 180); }); }
})();

<script id="remember-last-position-special">
(() => {
  const storageKey = 'emoji-symbol-last-scroll-special-v1';
  let saveFrame = 0;
  const savePosition = () => {
    try { localStorage.setItem(storageKey, String(Math.max(0, window.scrollY || document.documentElement.scrollTop || 0))); } catch (_) {}
  };
  window.addEventListener('scroll', () => {
    if (saveFrame) cancelAnimationFrame(saveFrame);
    saveFrame = requestAnimationFrame(() => { saveFrame = 0; savePosition(); });
  }, { passive: true });
  window.addEventListener('pagehide', savePosition);
  const restorePosition = () => {
    try {
      const saved = Number(localStorage.getItem(storageKey));
      if (Number.isFinite(saved) && saved > 0) window.scrollTo({ top: saved, left: 0, behavior: 'instant' });
    } catch (_) {}
  };
  window.addEventListener('load', () => {
    requestAnimationFrame(() => { restorePosition(); setTimeout(restorePosition, 180); setTimeout(restorePosition, 650); });
  });
  if (document.readyState === 'complete') { requestAnimationFrame(() => { restorePosition(); setTimeout(restorePosition, 180); }); }
})();

<script>
'use strict';
const emojiFrame = document.getElementById('emojiFrame');
const specialFrame = document.getElementById('specialFrame');
const frames = { emoji: emojiFrame, special: specialFrame };
const loaded = { emoji: false, special: false };
const MODE_KEY = 'emoji-symbol-last-mode-v1';
let currentMode = 'emoji';
function readSource(id) {
  const node = document.getElementById(id);
  const text = node.textContent.replace(/@@SC@@/g, '</script').replace(/@@CM@@/g, '<!--');
  node.remove();
  return text;
}
// 화면에 필요한 페이지만 로드합니다. 심볼 페이지는 처음 열거나 전환 버튼에 닿을 때 만들어집니다.
function ensureLoaded(mode) {
  if (!Object.prototype.hasOwnProperty.call(frames, mode) || loaded[mode]) return;
  loaded[mode] = true;
  frames[mode].srcdoc = readSource('src-' + mode);
}
function setMode(mode) {
  if (!Object.prototype.hasOwnProperty.call(frames, mode)) return;
  currentMode = mode;
  for (const [name, frame] of Object.entries(frames)) frame.classList.toggle('active', name === mode);
  ensureLoaded(mode);
  try { localStorage.setItem(MODE_KEY, mode); } catch (_) {}
  document.title = '✨ 이모지 & 🔣 심볼';
}
// 마지막으로 보던 화면(이모지/심볼)에서 다시 시작합니다.
let startMode = 'emoji';
try { const saved = localStorage.getItem(MODE_KEY); if (saved === 'emoji' || saved === 'special') startMode = saved; } catch (_) {}
setMode(startMode);
window.addEventListener('message', (event) => {
  if (event.source !== emojiFrame.contentWindow && event.source !== specialFrame.contentWindow) return;
  const data = event.data;
  if (!data) return;
  if (data.type === 'explorer-switch-mode' && (data.mode === 'emoji' || data.mode === 'special')) setMode(data.mode);
  else if (data.type === 'explorer-prefetch' && (data.mode === 'emoji' || data.mode === 'special')) ensureLoaded(data.mode);
});
</script>
