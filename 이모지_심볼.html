};
const emojiFrame = document.getElementById('emojiFrame');
const specialFrame = document.getElementById('specialFrame');
const frames = { emoji: emojiFrame, special: specialFrame };
async function decodeGzipBase64(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}
function setMode(mode) {
  if (!Object.prototype.hasOwnProperty.call(frames, mode)) return;
  for (const [name, frame] of Object.entries(frames)) frame.classList.toggle('active', name === mode);
  document.title = '✨ 이모지 & 🔣 심볼';
}
Promise.all([decodeGzipBase64(PAGE_DATA.emoji), decodeGzipBase64(PAGE_DATA.special)])
  .then(([emojiHtml, specialHtml]) => {
    emojiFrame.srcdoc = emojiHtml;
    specialFrame.srcdoc = specialHtml;
  })
  .catch((error) => {
    console.error('탐색기 초기화 실패:', error);
    document.body.innerHTML = '<p style="margin:24px;color:#eef2f8;font:16px system-ui">탐색기를 불러오지 못했습니다. 최신 Chrome 또는 Edge 브라우저에서 다시 열어 주세요.</p>';
  });
window.addEventListener('message', (event) => {
  if (event.source !== emojiFrame.contentWindow && event.source !== specialFrame.contentWindow) return;
  const data = event.data;
  if (data && data.type === 'explorer-switch-mode' && (data.mode === 'emoji' || data.mode === 'special')) setMode(data.mode);
});
</script>
