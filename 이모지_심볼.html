<script>

function applyUnifiedNameToggleUi(doc){if(!doc)return;const en=doc.getElementById('toggleEnglishNames'),ko=doc.getElementById('toggleKoreanNames');if(en)en.setAttribute('aria-pressed',String(unifiedShowEnglish));if(ko)ko.setAttribute('aria-pressed',String(unifiedShowKorean));const section=doc.getElementById('unifiedInlineSearch');if(section){section.classList.toggle('show-unified-english',unifiedShowEnglish);section.classList.toggle('show-unified-korean',unifiedShowKorean);}}
function attachUnifiedNameToggleHandlers(mode){const doc=frames[mode]?.contentDocument;if(!doc)return;const en=doc.getElementById('toggleEnglishNames'),ko=doc.getElementById('toggleKoreanNames');if(unifiedToggleSession&&!unifiedOriginalToggleStates[mode]&&en&&ko)unifiedOriginalToggleStates[mode]={english:en.getAttribute('aria-pressed')==='true',korean:ko.getAttribute('aria-pressed')==='true'};if(!unifiedToggleHandlersAttached[mode]&&en&&ko){const toggle=(kind,ev)=>{if(!unifiedToggleSession)return;ev.preventDefault();ev.stopImmediatePropagation();if(kind==='english')unifiedShowEnglish=!unifiedShowEnglish;else unifiedShowKorean=!unifiedShowKorean;for(const m of ['emoji','special'])applyUnifiedNameToggleUi(frames[m]?.contentDocument);};en.addEventListener('click',ev=>toggle('english',ev),true);ko.addEventListener('click',ev=>toggle('korean',ev),true);unifiedToggleHandlersAttached[mode]=true;}if(unifiedToggleSession)applyUnifiedNameToggleUi(doc);}

async function readSource(id) {
  const node = document.getElementById(id);
  const bin = atob(node.textContent.trim());
  node.remove();
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}

    if (currentIndex < 0) return;
    const targetIndex = (currentIndex + dir + categories.length) % categories.length;
    navigateWholeTarget(categories[targetIndex], targetIndex, categories.length, currentMode);
  }

  function resolveTarget(dir, here){
    const i = here.findIndex(b => b.classList.contains('active'));   // '전체'가 활성이면 -1
    const other = MODES[(MODES.indexOf(currentMode) + 1) % MODES.length];
    if (dir > 0) return (i + 1 < here.length) ? { mode: currentMode, idx: i + 1 } : { mode: other, idx: 0 };
    return (i > 0) ? { mode: currentMode, idx: i - 1 } : { mode: other, idx: 'last' };
  }

  function resetFrame(f){ f.style.transition = ''; f.style.transform = ''; f.style.opacity = ''; f.style.willChange = ''; }
  function killAnim(){ if (anim) { try { anim.cancel(); } catch (_) {} anim = null; } }

  // 즉시 전환: 내용 교체는 동기로 처리하고, 새 화면은 컴포지터 애니메이션(transform/opacity)으로 밀어 넣음
  function commit(dir, target, chips){
    killAnim();
    const fromFrame = frames[currentMode];
    const idx = target.idx === 'last' ? chips.length - 1 : target.idx;
    const toFrame = frames[target.mode];
    if (target.mode !== currentMode) setMode(target.mode);
    resetFrame(fromFrame); resetFrame(toFrame);
    chips[idx].click();                                       // 각 페이지의 기존 필터/세부분류 로직 그대로 사용
    try { toFrame.contentWindow.scrollTo({ top: 0, left: 0, behavior: 'instant' }); } catch (_) {}
    if (IN_MS) {
      const a = toFrame.animate(
        [{ transform: `translate3d(${dir > 0 ? 22 : -22}%,0,0)`, opacity: .55 }, { transform: 'translate3d(0,0,0)', opacity: 1 }],
        { duration: IN_MS, easing: EASE }
      );
      anim = a;
      a.onfinish = a.oncancel = () => { if (anim === a) anim = null; };
    }
    showHint(target.mode, chips, idx);
  }

  function go(dir, preferredCategory){
    if (loading || unifiedQuery.trim()) return;
    const here = chipsOf(currentMode);
    if (!here) return;                                         // 아직 로딩 전
    if (isWholeCategoryView(currentMode)) { goWholeCategory(dir, preferredCategory); return; }
    const target = resolveTarget(dir, here);
    const chips = target.mode === currentMode ? here : chipsOf(target.mode);
    if (chips) { commit(dir, target, chips); return; }        // 빠른 경로: 대기 없음

    // 느린 경로: 반대편 페이지가 아직 준비되지 않음 → 현재 화면을 밀어내며 로딩 대기
    loading = true;
    const fromFrame = frames[currentMode];
    killAnim();
    let outAnim = null;
    if (IN_MS) outAnim = fromFrame.animate(
      [{ transform: fromFrame.style.transform || 'translate3d(0,0,0)', opacity: 1 }, { transform: `translate3d(${dir > 0 ? -22 : 22}%,0,0)`, opacity: 0 }],
      { duration: 120, easing: 'ease-in', fill: 'forwards' });
    waitChips(target.mode).then(c => {
      loading = false;
      if (outAnim) outAnim.cancel();
      resetFrame(fromFrame);
      if (c) commit(dir, target, c);
    });
  }
  window.swipeCategory = go;   // swipeCategory(1) / swipeCategory(-1)

  // ---- 제스처 처리 ----
  function categoryAtTarget(el, doc){
    if (!el || !el.closest) return '';
    const section = el.closest('.category-section[data-section]');
    return section && !section.hidden ? String(section.dataset.section || '') : '';
  }
  function categoryAtPoint(x, y, doc){
    if (typeof doc.elementsFromPoint === 'function') {
      const elements = doc.elementsFromPoint(x, y);
      for (const element of elements) {
        const name = categoryAtTarget(element, doc);
        if (name) return name;
      }
    }
    const sections = Array.from(doc.querySelectorAll('.category-section[data-section]')).filter(section => !section.hidden && section.getClientRects().length);
    let nearest = '', nearestDistance = Infinity;
    for (const section of sections) {
      const rect = section.getBoundingClientRect();
      if (y >= rect.top && y <= rect.bottom) return String(section.dataset.section || '');
      const distance = y < rect.top ? rect.top - y : y - rect.bottom;
      if (distance < nearestDistance) { nearestDistance = distance; nearest = String(section.dataset.section || ''); }
    }
    return nearestDistance <= 90 ? nearest : '';
  }
  function ignoreTarget(el, doc){
    if (!el || !el.closest) return false;
    if (el.closest('input,textarea,select,[role="dialog"],[class*="popup"],[class*="modal"],[contenteditable="true"]')) return true;
    const allActive = !!doc.querySelector('#topFilterChips [data-filter="전체"].active, #bottomFilterChips [data-filter="전체"].active');
    const section = el.closest('.category-section[data-section]');
    const allowCategorySwipe = allActive && !!section && !section.hidden;
    const win = doc.defaultView;
    for (let n = el; n && n !== doc.documentElement; n = n.parentElement) {
      if (n.scrollWidth > n.clientWidth + 2) {
        const ox = win.getComputedStyle(n).overflowX;
        if (ox === 'auto' || ox === 'scroll') {
          // 전체 보기의 본문 분류 안에서는 하위 가로 오버플로가 있어도 좌우 스와이프를 네비게이션으로 사용합니다.
          if (allowCategorySwipe && section.contains(n)) continue;
          return true;
        }
      }
    }
    return false;
  }
  const attached = new WeakSet();
  function attach(mode){
    const frame = frames[mode], doc = frame.contentDocument;
    if (!doc || !doc.body || attached.has(doc)) return;
    attached.add(doc);
    let g = null, raf = 0, pendingDx = 0;

    const paintDrag = () => { raf = 0; frame.style.transform = `translate3d(${pendingDx * 0.6}px,0,0)`; };
    const stopRaf = () => { if (raf) { cancelAnimationFrame(raf); raf = 0; } };

    doc.addEventListener('touchstart', e => {
      if (loading || e.touches.length !== 1 || unifiedQuery.trim() || ignoreTarget(e.target, doc)) { g = null; return; }
      killAnim(); resetFrame(frame);                           // 이전 전환 애니메이션 중에도 바로 다음 스와이프 허용
      const t = e.touches[0];
      g = { x: t.clientX, y: t.clientY, t: performance.now(), lock: null, dx: 0, category: categoryAtTarget(e.target, doc) || categoryAtPoint(t.clientX, t.clientY, doc) };
    }, { passive: true });

    doc.addEventListener('touchmove', e => {
      if (!g) return;
      if (e.touches.length !== 1) { g = null; stopRaf(); resetFrame(frame); return; }
      const t = e.touches[0], dx = t.clientX - g.x, dy = t.clientY - g.y;
      if (!g.lock) {
        if (Math.abs(dx) < LOCK_PX && Math.abs(dy) < LOCK_PX) return;
        g.lock = (Math.abs(dx) > Math.abs(dy) * 1.3) ? 'h' : 'v';
        if (g.lock === 'h') { frame.style.transition = 'none'; frame.style.willChange = 'transform'; }
      }
      if (g.lock !== 'h') return;
      if (e.cancelable) e.preventDefault();                    // 가로 스와이프 중에는 세로 스크롤 차단
      g.dx = dx; pendingDx = dx;
      if (!raf) raf = requestAnimationFrame(paintDrag);        // 프레임당 1회만 스타일 갱신
    }, { passive: false });

    const finish = (e, cancelled) => {
      const s = g; g = null;
      if (!s || s.lock !== 'h') return;
      stopRaf();
      if (e && e.cancelable) e.preventDefault();               // 스와이프 끝의 카드 복사 클릭 방지
      const dt = Math.max(1, performance.now() - s.t), v = Math.abs(s.dx) / dt;
      // 임계값 완화: 짧은 플릭(24px↑ & 0.35px/ms↑)이나 화면 폭 15%만 밀어도 확정
      const commitSwipe = !cancelled && (Math.abs(s.dx) > Math.min(64, innerWidth * 0.15) || (Math.abs(s.dx) > 24 && v > 0.35));
      if (commitSwipe) go(s.dx < 0 ? 1 : -1, s.category);      // 왼쪽으로 밀기 → 다음 / 오른쪽 → 이전; 본문 분류 기준
      else { frame.style.transition = 'transform .12s ease-out'; frame.style.transform = ''; setTimeout(() => resetFrame(frame), 140); }
    };
    doc.addEventListener('touchend', e => finish(e, false), { passive: false });
    doc.addEventListener('touchcancel', e => finish(e, true), { passive: false });

    // 데스크톱: 마우스 드래그 스와이프
    let m = null;
    doc.addEventListener('mousedown', e => {
      if (e.button !== 0 || loading || unifiedQuery.trim() || ignoreTarget(e.target, doc)) { m = null; return; }
      m = { x: e.clientX, y: e.clientY, moved: false, category: categoryAtTarget(e.target, doc) };
    });
    doc.addEventListener('mousemove', e => {
      if (m && !m.moved && Math.abs(e.clientX - m.x) > 12 && Math.abs(e.clientX - m.x) > Math.abs(e.clientY - m.y) * 1.4) m.moved = true;
    });
    doc.addEventListener('mouseup', e => {
      const s = m; m = null;
      if (!s || !s.moved) return;
      const dx = e.clientX - s.x;
      if (Math.abs(dx) > 100 && Math.abs(dx) > Math.abs(e.clientY - s.y) * 1.8) {
        doc.addEventListener('click', ev => { ev.stopPropagation(); ev.preventDefault(); }, { capture: true, once: true });
        go(dx < 0 ? 1 : -1, s.category);
      }
    });

    doc.addEventListener('keydown', onKey);
  }
  function onKey(e){
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const t = e.target;
    if (t && t.closest && t.closest('input,textarea,select,[contenteditable="true"]')) return;
    go(e.key === 'ArrowRight' ? 1 : -1);
  }
  document.addEventListener('keydown', onKey);

  for (const mode of MODES) {
    frames[mode].addEventListener('load', () => attach(mode));
    attach(mode);
  }

  // ---- 반대편 페이지 사전 로드(idle) ----
  // 현재 페이지의 카드 백그라운드 로딩이 끝난 뒤(또는 최대 6초 후) 유휴 시간에 반대편을 미리 풀어 둡니다.
  // → 이모지↔심볼 경계를 넘는 첫 스와이프도 대기 없이 즉시 전환됩니다.
  const idle = window.requestIdleCallback || (fn => setTimeout(fn, 200));
  const t0 = performance.now();
  (function warmOther(){
    const doc = frames[currentMode].contentDocument;
    const ready = doc && doc.documentElement && (doc.documentElement.dataset.cardsPreloaded === 'true' || doc.readyState === 'complete' && performance.now() - t0 > 6000);
    if (!ready && performance.now() - t0 < 8000) return void setTimeout(warmOther, 400);
    idle(() => {
      const other = MODES[(MODES.indexOf(currentMode) + 1) % MODES.length];
      ensureLoaded(other);
    }, { timeout: 2000 });
  })();
})();

</script>
</body>
</html>
